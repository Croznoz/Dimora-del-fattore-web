<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f6f1" />
      <stop offset="100%" stop-color="#dad4ca" />
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="#131313" />
  <circle cx="600" cy="600" r="510" fill="none" stroke="#6d6d6d" stroke-width="4" opacity="0.24" />
  <circle cx="600" cy="600" r="450" fill="none" stroke="#6d6d6d" stroke-width="2" opacity="0.16" />
  <path d="M 180 600 C 250 540 320 520 420 520 C 500 520 540 540 620 580 C 700 620 780 660 900 645 C 940 640 980 620 1020 600" fill="none" stroke="#6d6d6d" stroke-width="3" opacity="0.18" />
  <path d="M 500 520 C 520 480 560 430 600 430 C 640 430 680 480 700 520" fill="none" stroke="#6d6d6d" stroke-width="3" opacity="0.18" />
  <text x="50%" y="44%" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="120" fill="url(#textGradient)" filter="url(#softGlow)">
    La dimora
  </text>
  <text x="50%" y="58%" text-anchor="middle" font-family="'EB Garamond', Georgia, serif" font-size="108" fill="url(#textGradient)" filter="url(#softGlow)">
    del fattore
  </text>
</svg>
